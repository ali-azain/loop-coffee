
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Coffee | Premium Accessibility</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #FFFFFF;
      color: #000000;
      overflow-x: hidden;
      cursor: crosshair;
    }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'Roboto Mono', monospace; }
    
    /* Grain Texture Overlay */
    .grain::after {
      content: "";
      position: fixed;
      top: -150%;
      left: -150%;
      width: 300%;
      height: 300%;
      background-image: url("https://upload.wikimedia.org/wikipedia/commons/7/76/1k_filmgrain.png");
      opacity: 0.04;
      pointer-events: none;
      z-index: 9999;
      animation: grain 8s steps(10) infinite;
    }

    @keyframes grain {
      0%, 100% { transform:translate(0, 0) }
      10% { transform:translate(-5%, -10%) }
      20% { transform:translate(-15%, 5%) }
      30% { transform:translate(7%, -25%) }
      40% { transform:translate(-5%, 25%) }
      50% { transform:translate(-15%, 10%) }
      60% { transform:translate(15%, 0%) }
      70% { transform:translate(0%, 15%) }
      80% { transform:translate(3%, 35%) }
      90% { transform:translate(-10%, 10%) }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFFFF;
    }
    ::-webkit-scrollbar-thumb {
      background: #000000;
    }

    .grayscale-map {
      filter: grayscale(100%) invert(5%) contrast(105%);
    }

    .cinematic-img {
      aspect-ratio: 16/9;
      object-fit: cover;
      filter: contrast(1.1) grayscale(0.2);
    }
    
    html {
      scroll-behavior: smooth;
    }
  </style>
  <script type="module" crossorigin src="/loop-coffee/assets/index-CgHXrSPp.js"></script>
</head>
<body class="grain">
  <div id="root"></div>
</body>
</html>
