
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Coffee | Premium Accessibility</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #FFFFFF;
      color: #000000;
      overflow-x: hidden;
      cursor: crosshair;
    }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'Roboto Mono', monospace; }
    
    /* Custom Scrollbar for Minimalist look */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFFFF;
    }
    ::-webkit-scrollbar-thumb {
      background: #000000;
    }

    /* Grayscale Map Filter */
    .grayscale-map {
      filter: grayscale(100%) invert(5%) contrast(105%);
    }

    /* Cinematic image framing */
    .cinematic-img {
      aspect-ratio: 16/9;
      object-fit: cover;
      filter: contrast(1.1) grayscale(0.2);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
